# Build, test, publish y deploy automático a MonsterASP.NET (ex-somee).
# Se dispara en cada push a main (y se puede correr a mano desde la pestaña Actions).
# Los pushes de solo documentación (README, *.md) no deployan: el código de la
# app no cambió y el sitio sería idéntico; para redeploy sin cambios, usar la
# pestaña Actions (workflow_dispatch).
#
# Secretos requeridos en el repo (Settings > Secrets and variables > Actions),
# con los valores de la tarjeta "Visual Studio access" de la página Deploy del
# Control Panel:
#   WEBSITE_NAME           ej. siteXXXX
#   SERVER_COMPUTER_NAME   ej. https://siteXXXX.siteasp.net:8172
#   SERVER_USERNAME        el Login del Web Deploy
#   SERVER_PASSWORD        la contraseña del Web Deploy
# Docs: https://help.monsterasp.net/websites/git-deploy/github-actions

name: Deploy a MonsterASP.NET

on:
  push:
    branches: [ main ]
    # paths-ignore omite el run solo si TODOS los archivos del push matchean:
    # un push que mezcla código y docs deploya igual.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

# Deploys de a uno: si llegan dos pushes juntos, el segundo espera al primero
# (cancelarlo a mitad del upload dejaría el sitio en un estado raro).
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build_and_deploy:
    runs-on: windows-latest
    steps:
      - name: 1. Descargar código
        uses: actions/checkout@v4

      - name: 2. Configurar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: 3. Restaurar paquetes NuGet
        run: dotnet restore

      # libman: wwwroot/lib ya no va al repo; se baja bootstrap/jQuery del CDN
      # antes de publicar (sin restore el sitio queda sin CSS/JS).
      - name: 4. Restaurar librerías del front (libman)
        working-directory: TiendaOnline
        shell: pwsh
        run: dotnet tool install -g Microsoft.Web.LibraryManager.Cli; libman restore

      # Gate: si los tests no pasan, no se publica ni se sube nada al servidor.
      # En Release: valida además que el código compila con la misma config del publish.
      - name: 5. Ejecutar tests
        run: dotnet test --no-restore --configuration Release --verbosity minimal

      # Solo el proyecto web, no la sln (las DLLs de tests no van a producción).
      # Framework-dependent (self-contained false): el runtime lo provee el server.
      # Si algún día devuelve HTTP 500.30 por falta de runtime .NET 10, cambiar a
      # --self-contained true y el paquete lleva el runtime adentro.
      - name: 6. Publicar la app web
        run: dotnet publish TiendaOnline/TiendaOnline.csproj --configuration Release --self-contained false --output ./publish --runtime win-x86

      - name: 7. Deploy a MonsterASP.NET vía Web Deploy
        uses: rasmusbuchholdt/simply-web-deploy@2.1.0
        with:
          website-name: ${{ secrets.WEBSITE_NAME }}
          server-computer-name: ${{ secrets.SERVER_COMPUTER_NAME }}
          server-username: ${{ secrets.SERVER_USERNAME }}
          server-password: ${{ secrets.SERVER_PASSWORD }}

      # Verificación final: tras el deploy el app pool puede tardar en arrancar,
      # así que reintenta ~80 s. El check incluye la DB (SELECT 1): una base
      # caída también falla el run — señal temprana en vez de enterarse por
      # un cliente. Sirve además de target para un monitor externo (UptimeRobot).
      # Si algún día cambia la URL pública del sitio, editar acá.
      - name: 8. Verificar health check del sitio
        shell: pwsh
        run: |
          $url = "https://techstoreargentina.runasp.net/health"
          $ok = $false
          foreach ($i in 1..10) {
            try {
              $r = Invoke-WebRequest -Uri $url -UseBasicParsing -TimeoutSec 15
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch { Start-Sleep -Seconds 8 }
          }
          if (-not $ok) { throw "El health check de $url no respondio 200 despues del deploy" }
          "Health check OK"
