name: CI TiendaOnline

on:
  push:
    branches: [ main, feature-tests ]
    # Igual que publish.yml: pushes de solo docs (README/*.md) no corren CI.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest 

    steps:
    - name: 1. Descargar código
      uses: actions/checkout@v4

    - name: 2. Configurar .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: 3. Restaurar paquetes NuGet
      run: dotnet restore

    - name: 4. Restaurar librerías del front (libman)
      working-directory: TiendaOnline
      run: dotnet tool install -g Microsoft.Web.LibraryManager.Cli > /dev/null && libman restore

    - name: 5. Formato (dotnet format)
      run: dotnet format --verify-no-changes

    # Gate de CVEs: falla el build si algún paquete (directo o transitivo) de la
    # sln tiene vulnerabilidad publicada. Hoy los CVEs se cazaban a mano (el PKCS
    # #13 se vio por aviso del build); acá sale en cada push. Requiere restore.
    - name: 6. Audit de paquetes vulnerables
      run: |
        dotnet list TiendaOnline.sln package --vulnerable --include-transitive --format json > audit.json
        CVES=$(jq '[.projects[].packages[]? | .vulnerabilities[]?] | length' audit.json)
        if [ "$CVES" -gt 0 ]; then
          echo "::error::$CVES paquete(s) vulnerable(s) en la sln — actualizar o limitar"
          jq -c '.projects[].packages[]? | select((.vulnerabilities // []) | length > 0)' audit.json
          exit 1
        fi
        echo "OK: sin CVEs en la sln"

    - name: 7. Compilar proyecto
      run: dotnet build --no-restore

    - name: 8. Ejecutar Tests
      run: dotnet test --no-build --verbosity normal