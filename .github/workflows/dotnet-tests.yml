name: CI TiendaOnline

on:
  push:
    branches: [ main, feature-tests ]
    # Igual que publish.yml: pushes de solo docs (README/*.md) no corren CI.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest 

    steps:
    - name: 1. Descargar código
      uses: actions/checkout@v4

    - name: 2. Configurar .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: 3. Restaurar paquetes NuGet
      run: dotnet restore

    - name: 4. Formato (dotnet format)
      run: dotnet format --verify-no-changes

    - name: 5. Compilar proyecto
      run: dotnet build --no-restore

    - name: 6. Ejecutar Tests
      run: dotnet test --no-build --verbosity normal